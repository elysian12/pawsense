name: backend-ci

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/elysian12/pawsense-backend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker build -t "$IMAGE:$GITHUB_SHA" .
      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  # Pulls the image on the VM and restarts the container. Skipped (with a notice)
  # until DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY exist. ANTHROPIC_API_KEY and
  # API_TOKEN live only in ~/pawsense/.env on the VM.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: deploy-backend
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Skip without deploy secrets
        if: env.DEPLOY_HOST == '' || env.DEPLOY_USER == '' || env.DEPLOY_SSH_KEY == ''
        run: echo "::notice::Deploy skipped; set DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY to enable it."
      - name: Deploy over SSH
        if: env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.DEPLOY_SSH_KEY != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer a pinned host key; fall back to trust-on-first-use.
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "IMAGE=$IMAGE:$GITHUB_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          docker pull "$IMAGE"
          docker rm -f pawsense-backend 2>/dev/null || true
          docker run -d --name pawsense-backend --restart unless-stopped \
            --env-file "$HOME/pawsense/.env" -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 15); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 2
          done
          docker logs --tail 50 pawsense-backend
          exit 1
          REMOTE
